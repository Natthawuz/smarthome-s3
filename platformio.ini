; PlatformIO Project Configuration File
;
; บอร์ด: ESP32-S3-WROOM-1 N16R8 (16MB Flash, 8MB Octal PSRAM)
; ใช้กับ ESP32-S3-CAM + GPIO Extension Board (V2775)
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ---- Flash / PSRAM ต้องตรงกับบอร์ดจริง (N16R8 = 16MB flash, Octal PSRAM) ----
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi   ; Octal PSRAM (OPI)
board_upload.flash_size = 16MB

; huge_app.csv ให้พื้นที่ app ~3MB พอสำหรับเฟิร์มแวร์กล้อง+โมเดล AI ในเฟสทดสอบนี้
; (ยังเหลือพื้นที่ flash อีกมากบน 16MB ไว้ขยาย partition ทีหลังตอนเพิ่ม OTA/storage)
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

; ===== แต่ละ environment ด้านล่างคือไฟล์ทดสอบของแต่ละเฟส เลือกจาก dropdown ของ PlatformIO =====
; src/ มีหลายไฟล์ที่มี setup()/loop() ของตัวเอง ต้องกรองด้วย build_src_filter ให้คอมไพล์ทีละไฟล์เท่านั้น

[env:phase0-camera]
build_src_filter = -<*> +<phase0_camera_test.cpp>
; พินกล้องยืนยันแล้วจริงบนฮาร์ดแวร์ (Phase 0, 2026-07-29): ดู include/camera_pins.h

[env:phase2-hall]
build_src_filter = -<*> +<phase2_hall_servo_mpu.cpp>
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
    adafruit/Adafruit MPU6050@^2.2.6

[env:phase2-face-recognition]
build_src_filter = -<*> +<phase2_face_recognition.cpp>
; ต้อง Core Debug Level >= Info ถึงจะเห็น log debug ของไลบรารีนี้ (ตั้งได้ใน platformio.ini ด้วย build_flags ถ้าต้องการ)
lib_deps =
    https://github.com/eloquentarduino/EloquentEsp32cam.git#2.7.15
    madhephaestus/ESP32Servo@^3.0.5
; camera.pinout.wroom_s3() ในโค้ดตรงกับ camera_pins.h ที่ยืนยันแล้วใน Phase 0 ทุกพิน
; SERVO_PIN (IO14) ตรงกับที่ยืนยันแล้วใน Phase 2 (ห้องโถง) ดู include/hall_pins.h

[env:phase3-web-camera-door]
build_src_filter = -<*> +<phase3_web_camera_door.cpp>
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
; ต้องมี include/wifi_credentials.h ก่อน (คัดลอกจาก wifi_credentials.h.example แล้วใส่ SSID/PASSWORD จริง)

[env:phase4-face-scan-door]
build_src_filter = -<*> +<phase4_face_scan_door.cpp>
lib_deps =
    https://github.com/eloquentarduino/EloquentEsp32cam.git#2.7.15
    madhephaestus/ESP32Servo@^3.0.5
; ต้องมี include/wifi_credentials.h ก่อน + ต้อง enroll ใบหน้าไว้ก่อนผ่าน env phase2-face-recognition

; ===== Phase 5: ตรวจจับการล้ม — เฟส A ทดสอบหาพิน SD card เชิงประจักษ์ก่อน =====
; บอร์ด V2775 เป็น clone ไม่มีเอกสาร ต้องทดสอบแบบเดียวกับ Phase 0 (camera candidate)
; สลับ Candidate ได้จาก dropdown environment เหมือนเดิม
[env:phase5a-sd-test]
build_src_filter = -<*> +<phase5a_sd_pin_test.cpp>
build_flags = -D CANDIDATE=1

[env:phase5a-sd-test-candidate2]
build_src_filter = -<*> +<phase5a_sd_pin_test.cpp>
build_flags = -D CANDIDATE=2

; ===== Phase 5B: เว็บเก็บภาพสอนโมเดลลง SD =====
; พิน SD ยืนยันแล้ว (Candidate 1): CLK=39 CMD=38 D0=40 ดู include/sd_pins.h
[env:phase5b-capture-dataset]
build_src_filter = -<*> +<phase5b_capture_dataset.cpp>
; ต้องมี include/wifi_credentials.h ก่อน
