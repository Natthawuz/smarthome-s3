; PlatformIO Project Configuration File
;
; บอร์ด: ESP32-S3-WROOM-1 N16R8 (16MB Flash, 8MB Octal PSRAM)
; ใช้กับ ESP32-S3-CAM + GPIO Extension Board (V2775)
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ---- Flash / PSRAM ต้องตรงกับบอร์ดจริง (N16R8 = 16MB flash, Octal PSRAM) ----
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi   ; Octal PSRAM (OPI)
board_upload.flash_size = 16MB

; huge_app.csv ให้พื้นที่ app ~3MB พอสำหรับเฟิร์มแวร์กล้อง+โมเดล AI ในเฟสทดสอบนี้
; (ยังเหลือพื้นที่ flash อีกมากบน 16MB ไว้ขยาย partition ทีหลังตอนเพิ่ม OTA/storage)
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

; ===== แต่ละ environment ด้านล่างคือไฟล์ทดสอบของแต่ละเฟส เลือกจาก dropdown ของ PlatformIO =====
; src/ มีหลายไฟล์ที่มี setup()/loop() ของตัวเอง ต้องกรองด้วย build_src_filter ให้คอมไพล์ทีละไฟล์เท่านั้น

[env:phase0-camera]
build_src_filter = -<*> +<phase0_camera_test.cpp>
; พินกล้องยืนยันแล้วจริงบนฮาร์ดแวร์ (Phase 0, 2026-07-29): ดู include/camera_pins.h

[env:phase2-hall]
build_src_filter = -<*> +<phase2_hall_servo_mpu.cpp>
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
    adafruit/Adafruit MPU6050@^2.2.6

[env:phase2-face-recognition]
build_src_filter = -<*> +<phase2_face_recognition.cpp>
; ต้อง Core Debug Level >= Info ถึงจะเห็น log debug ของไลบรารีนี้ (ตั้งได้ใน platformio.ini ด้วย build_flags ถ้าต้องการ)
; แก้ไข 2026-08-01: ต้องใช้ partition table เดียวกับ phase10-final-merged เสมอ
; (partitions_final.csv) เพราะไลบรารีจดจำใบหน้าเก็บข้อมูลใบหน้าไว้ใน SPIFFS ซึ่งอยู่
; คนละตำแหน่งในหน่วยความจำ flash ถ้า partition table ไม่ตรงกัน — enroll ผ่าน
; environment นี้แล้วจะมองไม่เห็นข้อมูลตอนไปรันบน phase10-final-merged (เจอปัญหานี้
; มาแล้วจริง: enroll "Beam"/"sai" ไว้ตอนใช้ huge_app.csv เดิม แล้วมองไม่เห็นเลยตอน
; สลับไป partitions_final.csv) ถ้าจะ enroll คนใหม่/แก้ข้อมูลใบหน้าให้ phase10 ใช้
; ต้อง flash environment นี้ (ซึ่งตั้ง partition ตรงกันแล้ว) ไม่ใช่กลับไปใช้ huge_app.csv
board_build.partitions = partitions_final.csv
lib_deps =
    https://github.com/eloquentarduino/EloquentEsp32cam.git#2.7.15
    madhephaestus/ESP32Servo@^3.0.5
; camera.pinout.wroom_s3() ในโค้ดตรงกับ camera_pins.h ที่ยืนยันแล้วใน Phase 0 ทุกพิน
; SERVO_PIN (IO14) ตรงกับที่ยืนยันแล้วใน Phase 2 (ห้องโถง) ดู include/hall_pins.h

[env:phase3-web-camera-door]
build_src_filter = -<*> +<phase3_web_camera_door.cpp>
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
; ต้องมี include/wifi_credentials.h ก่อน (คัดลอกจาก wifi_credentials.h.example แล้วใส่ SSID/PASSWORD จริง)

[env:phase4-face-scan-door]
build_src_filter = -<*> +<phase4_face_scan_door.cpp>
lib_deps =
    https://github.com/eloquentarduino/EloquentEsp32cam.git#2.7.15
    madhephaestus/ESP32Servo@^3.0.5
; ต้องมี include/wifi_credentials.h ก่อน + ต้อง enroll ใบหน้าไว้ก่อนผ่าน env phase2-face-recognition

; ===== Phase 5: ตรวจจับการล้ม — เฟส A ทดสอบหาพิน SD card เชิงประจักษ์ก่อน =====
; บอร์ด V2775 เป็น clone ไม่มีเอกสาร ต้องทดสอบแบบเดียวกับ Phase 0 (camera candidate)
; สลับ Candidate ได้จาก dropdown environment เหมือนเดิม
[env:phase5a-sd-test]
build_src_filter = -<*> +<phase5a_sd_pin_test.cpp>
build_flags = -D CANDIDATE=1

[env:phase5a-sd-test-candidate2]
build_src_filter = -<*> +<phase5a_sd_pin_test.cpp>
build_flags = -D CANDIDATE=2

; ===== Phase 5B: เว็บเก็บภาพสอนโมเดลลง SD =====
; พิน SD ยืนยันแล้ว (Candidate 1): CLK=39 CMD=38 D0=40 ดู include/sd_pins.h
[env:phase5b-capture-dataset]
build_src_filter = -<*> +<phase5b_capture_dataset.cpp>
; ต้องมี include/wifi_credentials.h ก่อน

; ===== Phase 5D: ตรวจจับการล้มด้วยโมเดลที่เทรนเอง (TensorFlow Lite Micro) + Buzzer =====
; โมเดลเทรนจาก training/train_model.py แปลงเป็น float32 ผ่าน training/export_float32.py
; แล้วคัดลอกมาที่ include/fall_model_data.h — BUZZER_PIN = IO2 (พินว่าง ไม่ชนอุปกรณ์อื่น)
; ใช้ RAM เยอะ (tensor arena 300KB จาก PSRAM) — huge_app.csv ยังพอสำหรับ flash
[env:phase5d-fall-detection]
build_src_filter = -<*> +<phase5d_fall_detection.cpp>
lib_deps =
    spaziochirale/Chirale_TensorFLowLite@^2.0.0
    spaziochirale/ArduTFLite@^1.0.1

; ===== Phase 5E: ทดสอบ PSRAM ล้วนๆ (วินิจฉัยปัญหา PSRAM ว่าง 0 bytes) =====
[env:phase5e-psram-test]
build_src_filter = -<*> +<phase5e_psram_test.cpp>

; ===== Phase 6: ห้องนอน — DHT22 + OLED 1.3" + เว็บ dashboard =====
; พิน: ดู include/bedroom_pins.h (DHT22=IO1, OLED I2C SDA=IO42 SCL=IO41)
; เดิมวางแผนใช้ DS18B20 ตามเอกสารโครงการ แต่ฮาร์ดแวร์จริงที่มีคือ DHT22 (AM2302)
; ต้องมี include/wifi_credentials.h ก่อน
[env:phase6-bedroom]
build_src_filter = -<*> +<phase6_bedroom.cpp>
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit SH110X@^2.1.11
    adafruit/Adafruit GFX Library@^1.11.5

; ===== Phase 7: ห้องน้ำ — ปุ่ม SOS + buzzer ทันที + เว็บ dashboard =====
; พิน: ดู include/bathroom_pins.h (ปุ่ม=IO22, buzzer=IO2 ใช้ร่วมกับ phase5d)
; ตัด Telegram ออกตามที่ตัดสินใจ ใช้ web dashboard แจ้งเตือนแทน
; ต้องมี include/wifi_credentials.h ก่อน
[env:phase7-bathroom-sos]
build_src_filter = -<*> +<phase7_bathroom_sos.cpp>

; ===== Phase 8: ห้องโถง — ตรวจแรงสั่นสะเทือนแผ่นดินไหวจาก MPU-6050 =====
; พิน: ดู include/hall_pins.h (MPU_SDA=21, MPU_SCL=47 ยืนยันแล้วใน Phase 2, buzzer=IO2)
; ต้องมี include/wifi_credentials.h ก่อน
[env:phase8-earthquake-detection]
build_src_filter = -<*> +<phase8_earthquake_detection.cpp>
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.14.1

; ===== Phase 9: ห้องครัว — ตรวจ CO (MQ-7) + ปั๊มน้ำผ่าน Relay =====
; พิน: ดู include/kitchen_pins.h (MQ7=IO1, Relay=IO39, Buzzer=IO2 — ไม่ยืมขาใครเลย
; หลังถอด SD card + ย้าย DHT22 ห้องนอนไป IO38)
; ต้องมี include/wifi_credentials.h ก่อน
[env:phase9-kitchen]
build_src_filter = -<*> +<phase9_kitchen.cpp>

; ===== Phase 10: เฟิร์มแวร์รวมสุดท้าย — ทุกห้องรันพร้อมกันในไฟล์เดียว =====
; พิน: ดู include/unified_pins.h (รวมทุก *_pins.h เดิม, แก้จุดชน GPIO14: ปุ่ม SOS
; ย้ายไป GPIO40, แยกบัส I2C เป็น Wire/Wire1 กัน OLED ชนกับ MPU-6050)
; พาร์ทิชัน: ดู partitions_final.csv (ขยาย app0 เป็น 8MB จาก 3MB เดิมของ huge_app.csv
; เพราะรวมไลบรารีกล้อง+จดจำใบหน้า+TensorFlow Lite+เซนเซอร์ทุกห้องเข้าด้วยกัน)
; ต้องมี include/wifi_credentials.h ก่อน
[env:phase10-final-merged]
build_src_filter = -<*> +<phase10_final_merged.cpp>
board_build.partitions = partitions_final.csv
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
    https://github.com/eloquentarduino/EloquentEsp32cam.git#2.7.15
    spaziochirale/Chirale_TensorFLowLite@^2.0.0
    spaziochirale/ArduTFLite@^1.0.1
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit SH110X@^2.1.11
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit BusIO@^1.14.1
